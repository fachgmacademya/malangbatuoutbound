<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143825"/>
      <stop offset="100%" stop-color="#2E7A4A"/>
    </linearGradient>
    <pattern id="cardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="700" height="450" fill="url(#cardGrad)"/>
  <rect width="700" height="450" fill="url(#cardPattern)"/>

  <!-- Mountain Hills in Background -->
  <path d="M0,380 Q180,310 350,340 T700,310 L700,450 L0,450 Z" fill="#000000" opacity="0.18"/>
  <path d="M0,400 Q200,360 420,380 T700,360 L700,450 L0,450 Z" fill="#000000" opacity="0.25"/>

  <!-- Center Decorative Icon: Smile / Energizer / Trophy / Fun -->
  <g transform="translate(350, 160)">
    <circle cx="0" cy="0" r="48" fill="#65B7E8" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="#FFD166"/>
    <path d="M-16,-2 C-8,-16 8,-16 16,-2" fill="none" stroke="#102A43" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-10" cy="-8" r="3.5" fill="#102A43"/>
    <circle cx="10" cy="-8" r="3.5" fill="#102A43"/>
    <!-- Confetti / Starburst -->
    <path d="M-38,-38 L-48,-48 M38,-38 L48,-48 M-38,38 L-48,48 M38,38 L48,48" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Category Badge -->
  <g transform="translate(45, 45)">
    <rect width="210" height="34" rx="17" fill="#0B1F33" fill-opacity="0.6" stroke="#65B7E8" stroke-width="1.2"/>
    <text x="105" y="22" fill="#65B7E8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">REKREASI CERIA</text>
  </g>

  <!-- Title Bottom Ribbon -->
  <g transform="translate(45, 360)">
    <rect width="610" height="54" rx="12" fill="#0B1F33" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <text x="30" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Outbound Fun Games & Ice Breaking</text>
  </g>
</svg>